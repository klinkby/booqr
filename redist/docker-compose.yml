
services:
  app:
    image: klinkby/booqr-app:409
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    volumes:
      - ./app_sock:/var/run/lighttpd
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test -S /var/run/lighttpd/sock" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "64M"
        reservations:
          memory: "16M"
          cpus: "0.1"

  api1:
    image: klinkby/booqr:178
    env_file:
      - ./.env
    networks:
      - service-net
    read_only: true
    volumes:
      - postgres_socket:/var/run/postgresql
      - ./api_sock:/var/run/api
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
      - /home/app/.aspnet/DataProtection-Keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Infrastructure__ConnectionString=Host=/var/run/postgresql;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Kestrel__UnixSocketPath=/var/run/api/sock
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "test -S /var/run/api/sock" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.5'
        reservations:
          memory: 32M
          cpus: '0.1'

  postgres:
    image: postgres:18-alpine3.23
    environment:
      - INSTANCE_UNIX_SOCKET=/var/run/postgresql
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    read_only: true
    volumes:
      - /mnt/postgres-hel1-1/booqr:/var/lib/postgresql/18/docker
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - postgres_socket:/var/run/postgresql
    tmpfs:
      - "/tmp:mode=1777,noexec,nosuid"
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
        reservations:
          memory: 64M
          cpus: '0.25'

  proxy:
    user: haproxy
    ports:
      - '80:8080/tcp'
      - '443:8443/tcp'
      - '443:8443/udp'
    image: haproxytech/haproxy-alpine:3.4.1
    volumes:
      - ./web-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /root/certs.pem:/etc/ssl/certs/certs.pem:ro
      - ./api_sock:/run/api
      - ./app_sock:/run/app
      - ./kli_sock:/run/kli
    networks:
      - gateway-net
    env_file:
      - ./web-gateway/gateway.env
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_socket:

networks:
  service-net:
  gateway-net:
