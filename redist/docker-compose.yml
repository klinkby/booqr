
services:
  app:
    image: klinkby/booqr-app:409
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    volumes:
      - ./app_sock:/var/run/lighttpd
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "test -S /var/run/lighttpd/sock" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "64M"
        reservations:
          memory: "16M"
          cpus: "0.1"

  api1:
    image: klinkby/booqr:178
    env_file:
      - ./.env
    networks:
      - service-net
    read_only: true
    volumes:
      - postgres_socket:/var/run/postgresql
      - ./api_sock:/var/run/api
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
      - /home/app/.aspnet/DataProtection-Keys
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Tenancy (host -> tenant resolution middleware config).
      - Infrastructure__Tenancy__BaseDomain=${TENANCY_BASE_DOMAIN}
      - Infrastructure__Tenancy__ReservedSubdomains__0=www
      - Infrastructure__Tenancy__ReservedSubdomains__1=api
      - Infrastructure__Tenancy__ReservedSubdomains__2=status
      # Per-tenant data-source factory: base connection (no credentials) + HMAC master secret used
      # to derive each t_<id> role's password at request time. No POSTGRES_USER superuser creds here.
      - Infrastructure__TenantDataSources__BaseConnectionString=Host=/var/run/postgresql;Database=${POSTGRES_DB}
      - Infrastructure__TenantDataSources__MasterSecret=${TENANT_MASTER_SECRET}
      # Registry connection (booqr_registry, SELECT-only on public.tenants) — resolves host -> tenant.
      - Infrastructure__Registry__ConnectionString=Host=/var/run/postgresql;Database=${POSTGRES_DB}
      - Infrastructure__Registry__RegistryUsername=booqr_registry
      - Infrastructure__Registry__RegistryPassword=${BOOQR_REGISTRY_PASSWORD}
      - Kestrel__UnixSocketPath=/var/run/api/sock
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "test -S /var/run/api/sock" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.5'
        reservations:
          memory: 32M
          cpus: '0.1'

  # Scheduled worker: runs ReminderMail and other background jobs via WorkerRunner (no Kestrel, no
  # HTTP socket). Holds ONLY the booqr_batch (BYPASSRLS) credential — decoupled from the tenant
  # master secret, the registry credential, and JWT signing material — so a worker compromise can
  # read/write cross-tenant `app` rows via booqr_batch but cannot derive any t_<id> tenant role
  # password (TenantDataSources__MasterSecret) or mint tenant JWTs. Not on gateway-net and has no
  # api_sock mount, so it is unreachable from the proxy/internet in either direction.
  worker:
    image: klinkby/booqr:178
    command: ["worker"]
    env_file:
      - ./.env
    networks:
      - service-net
    read_only: true
    volumes:
      - postgres_socket:/var/run/postgresql
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Cross-tenant booqr_batch (BYPASSRLS) connection for background/scheduled work only.
      - Infrastructure__Batch__ConnectionString=Host=/var/run/postgresql;Database=${POSTGRES_DB}
      - Infrastructure__Batch__BatchUsername=booqr_batch
      - Infrastructure__Batch__BatchPassword=${BOOQR_BATCH_PASSWORD}
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ "CMD-SHELL", "test -n \"$(find /tmp/worker-alive -mmin -2)\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 16M
          cpus: '0.1'

  # Admin CLI container: applies migrations and provisions/deprovisions/rotates tenants. Holds the
  # elevated booqr_migrator credentials + tenant master secret — never the HAProxy `api` backend,
  # never a long-running process. Invoke on demand, e.g.:
  #   docker compose run --rm admin admin --migrate
  #   docker compose run --rm admin admin --provision alice
  #   docker compose run --rm admin admin --deprovision 3
  #   docker compose run --rm admin admin --rotate
  admin:
    image: klinkby/booqr:178
    env_file:
      - ./.env
    # Internal network / postgres socket only — no api_sock mount, not on the gateway-net/service-net
    # split HAProxy routes through; unreachable from the proxy.
    networks:
      - service-net
    read_only: true
    volumes:
      - postgres_socket:/var/run/postgresql
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    environment:
      - BOOQR_ADMIN_CONNECTION_STRING=Host=/var/run/postgresql;Database=${POSTGRES_DB}
      - BOOQR_MIGRATOR_USERNAME=booqr_migrator
      - BOOQR_MIGRATOR_PASSWORD=${BOOQR_MIGRATOR_PASSWORD}
      - BOOQR_TENANT_MASTER_SECRET=${TENANT_MASTER_SECRET}
      - BOOQR_TENANT_MASTER_SECRET_NEW=${TENANT_MASTER_SECRET_NEW}
    # No default command: `docker compose run --rm admin admin --migrate|--provision <slug>|--deprovision <id>|--rotate`.
    # Not started by `docker compose up` (no `restart:`); a short-lived one-shot command, not a service.
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'
        reservations:
          memory: 16M
          cpus: '0.1'

  postgres:
    image: postgres:18-alpine3.23
    environment:
      - INSTANCE_UNIX_SOCKET=/var/run/postgresql
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    read_only: true
    volumes:
      - /mnt/postgres-hel1-1/booqr:/var/lib/postgresql/18/docker
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - postgres_socket:/var/run/postgresql
    tmpfs:
      - "/tmp:mode=1777,noexec,nosuid"
    network_mode: none
    restart: unless-stopped
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.5'
        reservations:
          memory: 64M
          cpus: '0.25'

  proxy:
    user: haproxy
    ports:
      - '80:8080/tcp'
      - '443:8443/tcp'
      - '443:8443/udp'
    image: haproxytech/haproxy-alpine:3.4.1
    volumes:
      - ./web-gateway/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - /root/certs.pem:/etc/ssl/certs/certs.pem:ro
      - ./api_sock:/run/api
      - ./app_sock:/run/app
      - ./kli_sock:/run/kli
    networks:
      - gateway-net
    env_file:
      - ./web-gateway/gateway.env
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 64M
          cpus: '0.1'
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_socket:

networks:
  service-net:
  gateway-net:
