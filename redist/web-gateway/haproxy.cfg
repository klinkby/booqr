global
    log stdout local0 info
    # Memory optimization settings
    tune.bufsize 16384
    tune.maxrewrite 1024
    maxconn 1000
    # Security settings
    ssl-default-bind-curves X25519:prime256v1:secp384r1
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.3 no-tls-tickets

defaults
    mode    http
    log     global
    option  httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout http-request 5s
    option forwardfor

backend per_ip
    stick-table type ip size 10k expire 30s store http_req_rate(10s)

frontend http-8080
    bind *:8080
    # Rate limiting (shared table, HTTP threshold)
    http-request track-sc0 src table per_ip
    http-request deny if { sc_http_req_rate(0,per_ip) gt 10 }
    # Ignore spam (thanks https://github.com/elabftw/elabftw/blob/34bc143bd37a79a8d4d3c3bda395417f7c8cceeb/documentation/config_examples/ha>
    acl evil_path path_reg -i ^/[0-9a-zA-Z_-]{1,10}\.php$
    acl evil_path path_reg -i (config|setup|install|backup|\.sql$|\.env$|\.git|vendor|cgi-bin|console|manager)
    acl evil_path path_reg -i (pma|mysql)
    acl evil_path path_reg -i (wp-content|wp-includes|wordpress|xmlrpc\.php|wlwmanifest\.xml|/wp[0-9]?/)
    acl evil_path path_reg -i (actuator|ignition|thinkphp|solr|jenkins|shell|hack\.php|cmd\.php|%[0-9A-Fa-f]{2}|\.htm$|\.tpl$)
    acl is_post_path path_beg -i /post/
    http-request set-log-level silent if evil_path !is_post_path
    http-request silent-drop rst-ttl 1 if evil_path !is_post_path
    # Block suspicious requests
    acl valid_methods method GET HEAD OPTIONS
    acl large_request hdr_val(content-length) gt 65535
    http-request deny if !valid_methods
    http-request deny if large_request
    # Health
    acl is_health path /health
    http-request return status 200 content-type "text/plain" lf-string "Healthy" if is_health
    # Otherwise
    redirect scheme https code 301 unless is_health

frontend https-8443
    option dontlognull
    bind *:8443 ssl crt /etc/ssl/booqr.dk/certs.pem alpn h2,http/1.1 strict-sni
    bind quic4@:8443 ssl crt /etc/ssl/booqr.dk/certs.pem alpn h3 strict-sni
    http-response set-header alt-svc "h3=\":443\"; ma=86400"
    http-response set-header Strict-Transport-Security "max-age=63072000; preload;"
    # Rate limiting (shared table, HTTPS threshold)
    http-request track-sc0 src table per_ip
    http-request deny if { sc_http_req_rate(0,per_ip) gt 50 }
    # Ignore spam (thanks https://github.com/elabftw/elabftw/blob/34bc143bd37a79a8d4d3c3bda395417f7c8cceeb/documentation/config_examples/ha>
    acl evil_path path_reg -i ^/[0-9a-zA-Z_-]{1,10}\.php$
    acl evil_path path_reg -i (config|setup|install|backup|\.sql$|\.env$|\.git|vendor|cgi-bin|console|manager)
    acl evil_path path_reg -i (pma|mysql)
    acl evil_path path_reg -i (wp-content|wp-includes|wordpress|xmlrpc\.php|wlwmanifest\.xml|/wp[0-9]?/)
    acl evil_path path_reg -i (actuator|ignition|thinkphp|solr|jenkins|shell|hack\.php|cmd\.php|%[0-9A-Fa-f]{2}|\.htm$|\.tpl$)
    acl is_post_path path_beg -i /post/
    http-request set-log-level silent if evil_path !is_post_path
    http-request silent-drop rst-ttl 1 if evil_path !is_post_path
    # Block suspicious requests
    acl valid_methods method GET POST PUT DELETE PATCH HEAD OPTIONS
    acl large_request hdr_val(content-length) gt 65535
    http-request deny if !valid_methods
    http-request deny if large_request
    # Naked domain redirect: apex-only (booqr.dk → www.booqr.dk), not tenant subdomains
    acl is_apex hdr(host) -i booqr.dk
    http-request redirect prefix https://www.%[hdr(host)] code 301 if is_apex

    acl is_booqr_domain hdr_end(host) -i .booqr.dk
    acl is_reserved_host hdr(host) -i www.booqr.dk mta_sts.booqr.dk status.booqr.dk

    use_backend api if is_booqr_domain !is_reserved_host { path_beg /api/ }
    use_backend app if is_booqr_domain !is_reserved_host
    default_backend deny

backend deny
    http-request deny deny_status 403

backend api
    http-request replace-uri ^https(://.*)$ http\1
    # HTTP/1.1 uptime monitors (e.g. UptimeRobot) probe /api/health with HEAD. HAProxy
    # mistranslates an HTTP/1.1 HEAD onto the HTTP/2-only backend socket and returns 502,
    # while GET and HTTP/2 HEAD both succeed. Rewrite only the health-probe HEAD to GET so the
    # h2 backend always sees a clean request; the small "Healthy" body is harmless to HEAD
    # monitors, which inspect only the status code.
    http-request set-method GET if { path /api/health } { method HEAD }
    server api1 /run/api/sock proto h2 check

backend app
    filter comp-res
    compression algo gzip
    compression type text/css text/html text/javascript text/plain
    compression offload
    http-request replace-uri ^https(://.*)$ http\1
    server app /run/app/sock proto h2 check
